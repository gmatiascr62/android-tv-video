name: Refresh C5N stream URL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-video-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Extract current live stream URL
        run: python scripts/refresh_video_json.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- video.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video.json
          git commit -m "Auto-refresh C5N stream URL"
          git push
