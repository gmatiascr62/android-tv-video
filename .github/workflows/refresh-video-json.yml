name: Refresh C5N stream URL

on:
  workflow_dispatch:
  # Desactivado por ahora: YouTube bloquea las IPs de GitHub Actions con
  # "Sign in to confirm you're not a bot", así que el cron solo fallaba en
  # silencio cada 15 min. Se puede reactivar (descomentando el schedule) el
  # día que se resuelva el bloqueo, por ejemplo pasándole cookies de sesión
  # a yt-dlp.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-video-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Extract current live stream URL
        run: python scripts/refresh_video_json.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- video.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video.json
          git commit -m "Auto-refresh C5N stream URL"
          git push
