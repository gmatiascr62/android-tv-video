name: Refresh C5N stream URL

on:
  workflow_dispatch:
  # Desactivado hasta confirmar que el secreto YT_COOKIES resuelve el
  # bloqueo de YouTube ("Sign in to confirm you're not a bot") a las IPs
  # de GitHub Actions. Una vez probado con un run manual, descomentar.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-video-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Write YouTube cookies (if configured)
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            printf '%s' "${{ secrets.YT_COOKIES }}" > "$RUNNER_TEMP/yt_cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> "$GITHUB_ENV"
            echo "Cookies cargadas."
          else
            echo "Sin secreto YT_COOKIES configurado, se sigue sin cookies."
          fi

      - name: Extract current live stream URL
        run: python scripts/refresh_video_json.py

      - name: Remove cookies file
        if: always()
        run: rm -f "$RUNNER_TEMP/yt_cookies.txt"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- video.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video.json
          git commit -m "Auto-refresh C5N stream URL"
          git push
